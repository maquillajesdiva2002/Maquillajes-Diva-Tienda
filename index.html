<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maquillajes Diva — Tienda 360</title>
<meta name="description" content="Recorré la tienda de Maquillajes Diva: mirá los estantes, armá tu pedido y envialo por WhatsApp.">
<meta name="theme-color" content="#7A2E42">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500;1,700&family=Jost:wght@400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
  :root {
    --polvo: #F5E6E2; --polvo-claro: #FBF4F2; --rosa: #DDAAA6; --burdeos: #7A2E42; --burdeos-osc: #5E2233;
    --oro: #C9A45C; --oro-claro: #E2C98F; --carbon: #2B2427; --texto-2: #6B5A5E; --rojo: #C8372D;
    --serif: "Playfair Display", Georgia, "Times New Roman", serif;
    --script: "Great Vibes", "Brush Script MT", cursive;
    --sans: "Jost", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--polvo); font-family: var(--sans); color: var(--carbon); }
  button { font-family: inherit; cursor: pointer; }

  /* ---------- Escena ---------- */
  #stage { position: fixed; inset: 0; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab;
    background: linear-gradient(180deg, #FBF4F2 0 50%, #EAD9D3 50% 100%); }
  #stage.arrastrando { cursor: grabbing; }
  #stage.sobre-objeto { cursor: pointer; }
  #scene { position: absolute; left: 50%; top: 50%; width: 0; height: 0; transform-style: preserve-3d; pointer-events: none; }
  #baldosas, #paredes, .sala3d { position: absolute; left: 0; top: 0; transform-style: preserve-3d; }
  .sala3d[hidden] { display: none; }
  .cara { position: absolute; transform-style: flat; overflow: hidden; }
  #fuentes { position: fixed; left: -20000px; top: 0; visibility: hidden; pointer-events: none; }
  .pared { position: absolute; left: 0; top: 0; background: linear-gradient(180deg, #FBF1EE 0%, var(--polvo) 55%, #EFD9D3 100%); }
  .pared::before { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(90deg, rgba(122,46,66,.10), transparent 12%, transparent 88%, rgba(122,46,66,.10)); }
  .pared::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 34px; background: var(--burdeos);
    box-shadow: 0 -4px 0 var(--oro); }
  .piso { background-color: #EAD9D3; background-image:
    linear-gradient(90deg, rgba(122,46,66,.08) 2px, transparent 2px), linear-gradient(0deg, rgba(122,46,66,.08) 2px, transparent 2px);
    background-size: 175px 175px; }
  .techo { background-color: #FBF4F2; }
  .huella { position: absolute; width: 260px; height: 220px; margin-left: -130px; margin-top: -110px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px; }
  .huella .circulo { width: 150px; height: 150px; border-radius: 50%; background: rgba(122,46,66,.14); border: 6px solid var(--burdeos);
    display: flex; align-items: center; justify-content: center; }
  .huella span { font-family: var(--serif); font-style: italic; font-size: 40px; color: var(--burdeos); font-weight: 700; }

  /* ---------- Sala de productos ---------- */
  .marca-agua { position: absolute; left: 0; right: 0; top: 60px; text-align: center; font-family: var(--script);
    font-size: 84px; color: rgba(122,46,66,.13); letter-spacing: .02em; white-space: nowrap; }
  .categoria { position: absolute; left: 0; right: 0; top: 170px; text-align: center; font-family: var(--serif); font-size: 76px;
    font-weight: 700; color: var(--burdeos); letter-spacing: -0.01em; }
  .categoria::after { content: ""; display: block; width: 120px; height: 4px; background: var(--oro); margin: 14px auto 0; border-radius: 2px; }
  .estante-fila { position: absolute; left: 270px; right: 270px; top: 300px; height: 290px; display: flex; justify-content: space-around; align-items: flex-end; }
  .tabla { position: absolute; left: 250px; right: 250px; top: 590px; height: 18px; background: var(--oro); border-radius: 4px;
    box-shadow: 0 10px 16px rgba(122,46,66,.18); }
  .producto-estante { position: relative; width: 250px; height: 290px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; }
  .producto-estante svg { width: 190px; height: 266px; }
  .producto-estante img { max-width: 280px; max-height: 260px; object-fit: contain; filter: drop-shadow(0 10px 10px rgba(122,46,66,.18)); }
  .proximamente { position: absolute; left: 50%; top: 380px; transform: translateX(-50%); font-family: var(--script); font-size: 96px; color: var(--burdeos); white-space: nowrap; }
  .precio-tag { position: absolute; bottom: -92px; left: 50%; transform: translateX(-50%); width: 236px; background: var(--polvo-claro);
    border: 2px solid var(--oro); border-radius: 10px; padding: 6px 10px; text-align: center; }
  .precio-tag b { display: block; font-size: 22px; font-weight: 500; color: var(--carbon); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .precio-tag span { display: block; font-size: 28px; font-weight: 600; color: var(--burdeos); }
  .sello { display: none; position: absolute; top: 90px; left: 50%; transform: translateX(-50%) rotate(-10deg); background: var(--rojo);
    color: #fff; font-size: 30px; font-weight: 600; padding: 4px 18px; border-radius: 8px; letter-spacing: .05em; }
  .producto-estante.agotado svg { filter: grayscale(1); opacity: .45; }
  .producto-estante.agotado .sello { display: block; }
  .pulso { position: absolute; top: 10px; right: 18px; width: 48px; height: 48px; border-radius: 50%; background: var(--burdeos); color: #fff;
    font-size: 34px; line-height: 48px; font-weight: 600; text-align: center; animation: pulso 2s infinite; }
  .producto-estante.agotado .pulso { display: none; }
  @keyframes pulso { 0% { box-shadow: 0 0 0 0 rgba(122,46,66,.5); } 70% { box-shadow: 0 0 0 22px rgba(122,46,66,0); } 100% { box-shadow: 0 0 0 0 rgba(122,46,66,0); } }
  .mueble { position: absolute; left: 300px; right: 300px; top: 720px; bottom: 34px; background: var(--burdeos); border-top: 10px solid var(--oro);
    display: flex; align-items: center; justify-content: center; }
  .ver-mas { background: none; border: 3px solid var(--oro); color: var(--oro-claro); border-radius: 999px; padding: 8px 34px;
    font-family: var(--serif); font-style: italic; font-size: 36px; }

  /* ---------- Sala de caja ---------- */
  .cartel-pedido { position: absolute; left: 50%; top: 170px; transform: translateX(-50%); background: var(--burdeos); color: var(--polvo);
    border: 4px solid var(--oro); border-radius: 999px; padding: 12px 40px; font-family: var(--serif); font-style: italic; font-size: 44px; white-space: nowrap; }
  .caja { position: absolute; left: 50%; bottom: 372px; transform: translateX(-50%); width: 280px; background: none; border: 0; }
  .caja .pulso { top: -10px; right: -16px; }
  .mostrador { position: absolute; left: 300px; right: 300px; bottom: 34px; height: 340px; }
  .mostrador .tapa { position: absolute; left: -24px; right: -24px; top: 0; height: 30px; background: var(--oro); border-radius: 6px; }
  .mostrador .frente { position: absolute; left: 0; right: 0; top: 30px; bottom: 0; background: repeating-linear-gradient(90deg, var(--burdeos) 0 96px, var(--burdeos-osc) 96px 100px);
    display: flex; align-items: center; justify-content: center; }
  .mostrador .frente span { font-family: var(--serif); font-style: italic; font-size: 64px; color: var(--oro-claro); }
  .espejo { position: absolute; left: 50%; top: 150px; transform: translateX(-50%); width: 680px; height: 520px; background: var(--oro);
    border-radius: 26px; padding: 56px; box-shadow: 0 24px 40px rgba(122,46,66,.25); }
  .vidrio { width: 100%; height: 100%; border-radius: 10px; background: linear-gradient(135deg, var(--burdeos) 0%, var(--burdeos-osc) 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px 40px; }
  .espejo-titulo { font-family: var(--serif); font-style: italic; color: var(--polvo); font-size: 68px; line-height: 1.08; }
  .espejo-sub { font-size: 30px; color: var(--rosa); margin-top: 20px; letter-spacing: .14em; text-transform: uppercase; }
  .foco { position: absolute; width: 30px; height: 30px; border-radius: 50%; background: #FFF6E0; box-shadow: 0 0 16px 6px rgba(255,226,160,.9);
    animation: brillo 2.4s ease-in-out infinite; }
  @keyframes brillo { 50% { box-shadow: 0 0 8px 2px rgba(255,226,160,.6); } }
  .logo-img { position: absolute; left: 50%; top: 110px; transform: translateX(-50%); width: 620px; height: 620px; border-radius: 50%;
    border: 16px solid var(--oro); object-fit: cover; box-shadow: 0 24px 40px rgba(122,46,66,.22); background: #fff; }
  .logo-grande { position: absolute; left: 0; right: 0; top: 250px; text-align: center; }
  .logo-grande .nombre { font-family: var(--serif); font-style: italic; font-weight: 700; font-size: 170px; color: var(--burdeos); line-height: 1; }
  .logo-grande .pre { font-family: var(--sans); font-size: 40px; letter-spacing: .5em; color: var(--oro); text-transform: uppercase; margin-bottom: 10px; padding-left: .5em; }
  .logo-grande .linea { width: 260px; height: 5px; background: var(--oro); margin: 30px auto 0; border-radius: 3px; }
  .cartelera { position: absolute; left: 50%; top: 150px; transform: translateX(-50%); width: 680px; height: 580px; background: var(--polvo-claro);
    border: 18px solid var(--oro); border-radius: 12px; box-shadow: 0 24px 40px rgba(122,46,66,.18); padding: 44px 56px; }
  .cartelera h3 { font-family: var(--serif); font-size: 52px; color: var(--burdeos); margin-bottom: 18px; }
  .cartelera-texto { font-size: 34px; line-height: 1.45; color: var(--carbon); white-space: pre-line; }

  /* ---------- Interfaz ---------- */
  .ui { position: fixed; z-index: 10; }
  .marca-ui { top: calc(14px + env(safe-area-inset-top, 0px)); left: 16px; background: rgba(251,244,242,.95); padding: 7px 16px;
    border-radius: 999px; font-family: var(--script); font-weight: 400; font-size: 25px; line-height: 1.1; color: var(--burdeos); box-shadow: 0 4px 14px rgba(0,0,0,.15); }
  .btn-lista { top: calc(14px + env(safe-area-inset-top, 0px)); right: 16px; background: rgba(251,244,242,.95); border: 0; padding: 9px 16px;
    border-radius: 999px; font-size: 15px; font-weight: 500; color: var(--carbon); box-shadow: 0 4px 14px rgba(0,0,0,.15); }
  .pista { left: 50%; top: 40%; transform: translate(-50%,-50%); background: rgba(43,36,39,.88); color: var(--polvo); padding: 14px 20px;
    border-radius: 16px; font-size: 16px; text-align: center; line-height: 1.4; pointer-events: none; transition: opacity .6s; max-width: 82vw; }
  .pista.oculta { opacity: 0; }
  .btn-sala { left: 16px; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); background: var(--polvo-claro); color: var(--burdeos);
    border: 2px solid var(--burdeos); border-radius: 999px; padding: 12px 18px; font-size: 16px; font-weight: 600; box-shadow: 0 8px 22px rgba(0,0,0,.25); }
  .btn-carrito { right: 16px; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); background: var(--burdeos); color: var(--polvo); border: 0;
    border-radius: 999px; padding: 14px 22px 14px 18px; display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 600; box-shadow: 0 8px 24px rgba(0,0,0,.3); }
  .btn-carrito svg { width: 22px; height: 22px; }
  .badge { position: absolute; top: -6px; right: -6px; min-width: 26px; height: 26px; padding: 0 7px; border-radius: 13px; background: var(--rojo);
    color: #fff; font-size: 14px; font-weight: 700; line-height: 22px; text-align: center; border: 2px solid var(--polvo); display: none; }
  .badge.visible { display: block; }
  .badge.salto { animation: salto .4s; }
  @keyframes salto { 40% { transform: scale(1.35); } }
  .aviso { left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(10px); background: var(--polvo-claro);
    color: var(--carbon); padding: 10px 18px; border-radius: 999px; font-size: 15px; font-weight: 500; box-shadow: 0 6px 18px rgba(0,0,0,.25);
    opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; white-space: nowrap; }
  .aviso.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
  .fundido { position: fixed; inset: 0; z-index: 9; background: var(--polvo); opacity: 0; pointer-events: none; transition: opacity .18s; }
  .fundido.activo { opacity: 1; }

  .capa { position: fixed; inset: 0; z-index: 20; background: rgba(43,36,39,.55); display: none; align-items: flex-end; justify-content: center; }
  .capa.abierta { display: flex; }
  .hoja { background: var(--polvo-claro); width: 100%; max-width: 480px; max-height: 88vh; overflow-y: auto; border-radius: 22px 22px 0 0;
    padding: 22px 20px calc(22px + env(safe-area-inset-bottom, 0px)); animation: subir .28s ease-out; }
  @media (min-width: 700px) { .capa { align-items: center; } .hoja { border-radius: 22px; } }
  @keyframes subir { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
  .cerrar { float: right; background: var(--polvo); border: 0; width: 36px; height: 36px; border-radius: 50%; font-size: 20px; color: var(--carbon); }
  .producto-img { display: block; width: 44%; max-width: 170px; margin: 6px auto 0; }
  img.producto-img { width: auto; max-width: 70%; max-height: 230px; object-fit: contain; }
  .producto-cat { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--oro); font-weight: 600; margin-top: 12px; }
  .producto-nombre { font-family: var(--serif); font-size: 28px; font-weight: 700; color: var(--burdeos); line-height: 1.15; margin-top: 2px; }
  .producto-desc { color: var(--texto-2); font-size: 15px; margin-top: 4px; }
  .producto-precio { font-size: 28px; font-weight: 600; color: var(--carbon); margin-top: 10px; }
  .etq-var { font-size: 14px; color: var(--texto-2); margin-top: 14px; }
  .variantes { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
  .variante { border: 2px solid #EAD1CB; background: #fff; border-radius: 999px; padding: 8px 14px; font-size: 15px; font-weight: 500; color: var(--carbon);
    display: inline-flex; align-items: center; gap: 8px; }
  .variante i { width: 16px; height: 16px; border-radius: 50%; display: inline-block; border: 1px solid rgba(0,0,0,.15); }
  .variante.activa { border-color: var(--burdeos); background: var(--burdeos); color: var(--polvo); }
  .btn-principal { width: 100%; margin-top: 18px; background: var(--burdeos); color: var(--polvo); border: 0; border-radius: 14px; padding: 16px; font-size: 17px; font-weight: 600; }
  .btn-principal:disabled { opacity: .45; cursor: not-allowed; }
  .btn-wa { background: #1F7A4A; }
  .btn-secundario { width: 100%; margin-top: 10px; background: transparent; color: var(--burdeos); border: 2px solid var(--burdeos); border-radius: 14px; padding: 14px; font-size: 16px; font-weight: 600; }
  h2.titulo-hoja { font-family: var(--serif); font-size: 26px; color: var(--burdeos); margin-bottom: 12px; }
  .item { display: grid; grid-template-columns: 48px 1fr; gap: 12px; padding: 14px 0; border-top: 1px solid #EAD1CB; }
  .item svg, .item img { width: 48px; height: 66px; object-fit: contain; }
  .item-nombre { font-weight: 600; font-size: 16px; }
  .item-sub { color: var(--texto-2); font-size: 14px; }
  .item-controles { display: flex; align-items: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .ctrl { width: 36px; height: 36px; border-radius: 10px; border: 2px solid #EAD1CB; background: #fff; font-size: 20px; font-weight: 700; color: var(--carbon); line-height: 1; }
  .cant { min-width: 28px; text-align: center; font-weight: 700; font-size: 17px; }
  .quitar { margin-left: auto; background: none; border: 0; color: var(--burdeos); font-size: 14px; font-weight: 500; text-decoration: underline; }
  .item-subtotal { font-weight: 700; font-size: 15px; margin-left: 6px; }
  .total { display: flex; justify-content: space-between; align-items: baseline; border-top: 2px solid var(--burdeos); margin-top: 6px; padding-top: 14px; font-size: 18px; }
  .total b { font-size: 26px; }
  .vacio { color: var(--texto-2); padding: 18px 0 6px; }
  .pestanas { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 4px; }
  .pestana { flex: none; border: 2px solid #EAD1CB; background: #fff; border-radius: 999px; padding: 8px 14px; font-size: 14px; font-weight: 500; color: var(--carbon); }
  .pestana.activa { background: var(--burdeos); border-color: var(--burdeos); color: var(--polvo); }
  .lista-item { display: grid; grid-template-columns: 52px 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid #EAD1CB; }
  .lista-item svg, .lista-item img { width: 52px; height: 72px; object-fit: contain; }
  .lista-item button { background: var(--burdeos); color: var(--polvo); border: 0; border-radius: 10px; padding: 10px 14px; font-size: 14px; font-weight: 600; }
  .agotado-txt { color: var(--rojo); font-weight: 600; }
  .credito { text-align: center; font-size: 12px; color: var(--texto-2); margin-top: 18px; }
  .credito a { color: var(--texto-2); }
  button:focus-visible { outline: 3px solid var(--oro); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { .foco, .pulso { animation: none; } }
</style>
</head>
<body>

<!-- ================= PAREDES (fuentes que se copian a la escena) ================= -->
<div id="fuentes">
  <div data-sala="productos">
    <div class="pared" data-pared="frente"></div>
    <div class="pared" data-pared="derecha"></div>
    <div class="pared" data-pared="atras"></div>
    <div class="pared" data-pared="izquierda"></div>
  </div>
  <div data-sala="caja">
    <div class="pared" data-pared="frente">
      <div class="cartel-pedido">Pedí por WhatsApp</div>
      <button class="caja" aria-label="Caja: enviar pedido por WhatsApp">
        <svg viewBox="0 0 260 190" width="280" height="205" aria-hidden="true">
          <rect x="30" y="20" width="200" height="70" rx="10" fill="#2B2427"/>
          <rect x="50" y="36" width="160" height="38" rx="6" fill="#F5E6E2"/>
          <text x="130" y="63" text-anchor="middle" font-size="22" font-weight="700" fill="#7A2E42" font-family="Jost, sans-serif">PEDIDO</text>
          <path d="M20 100 H240 L250 170 H10 Z" fill="#3A2F33"/>
          <g fill="#F5E6E2"><rect x="46" y="112" width="28" height="14" rx="3"/><rect x="84" y="112" width="28" height="14" rx="3"/><rect x="122" y="112" width="28" height="14" rx="3"/>
          <rect x="46" y="134" width="28" height="14" rx="3"/><rect x="84" y="134" width="28" height="14" rx="3"/><rect x="122" y="134" width="28" height="14" rx="3"/></g>
          <rect x="166" y="112" width="56" height="36" rx="5" fill="#C9A45C"/>
          <rect x="0" y="170" width="260" height="20" rx="4" fill="#2B2427"/>
        </svg>
        <span class="pulso" aria-hidden="true">$</span>
      </button>
      <div class="mostrador"><div class="tapa"></div><div class="frente"><span>Caja</span></div></div>
    </div>
    <div class="pared" data-pared="derecha">
      <div class="espejo"><div class="vidrio"><div class="espejo-titulo"></div><div class="espejo-sub"></div></div></div>
    </div>
    <div class="pared" data-pared="atras">
      <img class="logo-img" src="Img/logo.jpg" alt="Maquillajes Diva">
    </div>
    <div class="pared" data-pared="izquierda">
      <div class="cartelera"><h3>Para tener en cuenta</h3><div class="cartelera-texto"></div></div>
    </div>
  </div>
</div>

<div id="stage" aria-label="Recorrido 360 de la tienda. Arrastrá para mirar alrededor.">
  <div id="scene" aria-hidden="true">
    <div id="paredes"></div>
    <div id="baldosas"></div>
  </div>
</div>
<div class="fundido" id="fundido"></div>

<div class="ui marca-ui">Maquillajes Diva</div>
<button class="ui btn-lista" id="btnLista">Ver como lista</button>
<div class="ui pista" id="pista">Arrastrá para mirar los estantes.<br>Tocá un producto para verlo.</div>
<button class="ui btn-sala" id="btnSala">Ir a la caja →</button>
<button class="ui btn-carrito" id="btnCarrito" aria-label="Abrir carrito">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M6 6h15l-1.5 9h-12z"/><path d="M6 6 5 2H2"/><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/></svg>
  Carrito<span class="badge" id="badge">0</span>
</button>
<div class="ui aviso" id="aviso"></div>

<div class="capa" id="capaProducto" role="dialog" aria-modal="true" aria-labelledby="prodNombre">
  <div class="hoja">
    <button class="cerrar" data-cerrar aria-label="Cerrar">×</button>
    <div id="prodImg"></div>
    <div class="producto-cat" id="prodCat"></div>
    <div class="producto-nombre" id="prodNombre"></div>
    <div class="producto-desc" id="prodDesc"></div>
    <div class="producto-precio" id="prodPrecio"></div>
    <div id="prodVarWrap"><div class="etq-var">Tono</div><div class="variantes" id="prodVariantes" role="group" aria-label="Tono"></div></div>
    <button class="btn-principal" id="btnAgregar">Agregar al carrito</button>
  </div>

function ajustarPerspectiva() {

  stage.style.perspective = persp + 'px'; render();
}
function render() { scene.style.transform = `translateZ(${persp}px) rotateX(${pitch}deg) rotateY(${yaw}deg)`; }
addEventListener('resize', ajustarPerspectiva); ajustarPerspectiva();

function rayo(cx, cy) {

}
function objetoEn(cx, cy) {

  const b = $('badge'), n = totalItems(); b.textContent = n; b.classList.toggle('visible', n > 0);
  if (salto) { b.classList.remove('salto'); void b.offsetWidth; b.classList.add('salto'); }
  $('btnCarrito').setAttribute('aria-label', `Abrir carrito, ${n} artículo${n === 1 ? '' : 's'}`);
  $('listaCarrito').innerHTML = !carrito.length ? '<p class="vacio">Tu pedido está vacío. Tocá un producto del estante para agregarlo.</p>' :
    carrito.map((i, k) => { const p = prod(i.id); return `<div class="item">${productoVisual(p)}<div>
      <div class="item-nombre">${p.nombre}</div><div class="item-sub">${i.variante ? i.variante + ' · ' : ''}${precio(p.precio)} c/u</div>
      <div class="item-controles"><button class="ctrl" data-accion="menos" data-k="${k}" aria-label="Restar uno">−</button><span class="cant">${i.cant}</span>
      <button class="ctrl" data-accion="mas" data-k="${k}" aria-label="Sumar uno">+</button><span class="item-subtotal">${precio(i.cant * p.precio)}</span>
      <button class="quitar" data-accion="quitar" data-k="${k}">Quitar</button></div></div></div>`; }).join('');
  $('totalCarrito').querySelector('b').textContent = precio(totalPesos());
  $('btnFinalizar').disabled = !carrito.length; $('btnFinalizar').style.opacity = carrito.length ? 1 : .5;
}
$('listaCarrito').addEventListener('click', e => {
  const b = e.target.closest('[data-accion]'); if (!b) return; const i = carrito[+b.dataset.k];
  if (b.dataset.accion === 'mas') i.cant++; if (b.dataset.accion === 'menos') i.cant--;
  if (b.dataset.accion === 'quitar' || i.cant <= 0) carrito.splice(+b.dataset.k, 1); actualizar(false);
});
function mensajePedido() {
  const l = carrito.map(i => { const p = prod(i.id); return `• ${i.cant} × ${p.nombre}${i.variante ? ' (' + i.variante + ')' : ''} — ${precio(i.cant * p.precio)}`; });
  return `Hola ${TIENDA.nombre}, quiero hacer este pedido desde la tienda virtual:\n\n${l.join('\n')}\n\nTotal: ${precio(totalPesos())}`;
}
function irAWhatsApp() {
  if (!carrito.length) { avisar('Tu pedido está vacío'); return; }
  window.open(`https://wa.me/${TIENDA.whatsapp}?text=${encodeURIComponent(mensajePedido())}`, '_blank', 'noopener');
}
function clickCaja() { if (!carrito.length) { avisar('Primero elegí algún producto'); return; } irAWhatsApp(); }
$('btnCarrito').addEventListener('click', () => { actualizar(false); abrirCapa('capaCarrito'); });
$('btnFinalizar').addEventListener('click', irAWhatsApp);

/* ---------- Lista por categorías ---------- */
let catLista = TIENDA.categorias[0].id;
function renderLista() {
  $('pestanas').innerHTML = TIENDA.categorias.map(c => `<button class="pestana${c.id === catLista ? ' activa' : ''}" role="tab" aria-selected="${c.id === catLista}" data-cat="${c.id}">${c.nombre}</button>`).join('');
  $('listaProductos').innerHTML = TIENDA.productos.filter(p => p.cat === catLista).map(p => `<div class="lista-item">${productoVisual(p)}
    <div><div class="item-nombre">${p.nombre}</div><div class="item-sub">${precio(p.precio)}${p.agotado ? ' · <span class="agotado-txt">Agotado</span>' : ''}</div></div>
    <button data-ver="${p.id}">Ver</button></div>`).join('');
}
function abrirLista(c) { if (c) catLista = c; renderLista(); cerrarCapas(); abrirCapa('capaLista'); }
$('pestanas').addEventListener('click', e => { const b = e.target.closest('[data-cat]'); if (b) { catLista = b.dataset.cat; renderLista(); } });
$('listaProductos').addEventListener('click', e => { const b = e.target.closest('[data-ver]'); if (b) abrirProducto(b.dataset.ver); });
$('btnLista').addEventListener('click', () => abrirLista());

/* ---------- Aplicar datos de la pizarra ---------- */
function aplicarDatos(d) {
  d = d || {}; const dp = d.productos || {};
  TIENDA.productos.forEach(p => {
    const x = dp[p.id] || {}; if (p.precioBase === undefined) p.precioBase = p.precio;
    p.precio = Number(x.precio) > 0 ? Number(x.precio) : p.precioBase; p.agotado = !!x.agotado;
    document.querySelectorAll(`.producto-estante[data-id="${p.id}"]`).forEach(el => {
      el.classList.toggle('agotado', p.agotado); el.querySelector('.precio-tag span').textContent = p.agotado ? 'Agotado' : precio(p.precio);
    });
  });
  const e = Object.assign({}, TIENDA.espejo, d.espejo || {});
  document.querySelectorAll('.espejo-titulo').forEach(el => el.textContent = (e.titulo || '').trim() || TIENDA.nombre);
  document.querySelectorAll('.espejo-sub').forEach(el => el.textContent = (e.sub || '').trim());
  const c = Object.assign({}, TIENDA.cartelera, d.cartelera || {});
  document.querySelectorAll('.cartelera-texto').forEach(el => el.textContent = (c.texto || '').trim());
  const antes = carrito.length; carrito = carrito.filter(i => !prod(i.id).agotado);
  if (carrito.length < antes) avisar('Se quitó del pedido un producto agotado');
  renderLista(); actualizar(false);
  if ($('capaProducto').classList.contains('abierta') && seleccion.id) pintarPrecioProducto(prod(seleccion.id));
}
escucharDatos(aplicarDatos);
actualizar(false);
</script>
</body>
</html>
